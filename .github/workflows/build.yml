name: Build PostBridge

# Runs automatically on every push to main.
# Can also be triggered manually: GitHub → Actions tab → Build PostBridge → Run workflow.

on:
  workflow_dispatch:   # manual trigger only — Actions tab → Build PostBridge → Run workflow

jobs:

  # ── Windows ──────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt

      - name: Pre-download Whisper models (tiny / base / small)
        # Bundling these three keeps the install size manageable while
        # covering the practical choices for non-GPU users.  Medium and
        # large-v3 still download on first use.  Helper script handles
        # faster-whisper version differences.
        run: python _download_bundled_models.py

      - name: Download ffmpeg (Windows x64)
        shell: pwsh
        run: |
          $base = "https://github.com/shaka-project/static-ffmpeg-binaries/releases/download/n7.1-2"
          New-Item -ItemType Directory -Force ffmpeg-bin | Out-Null
          Invoke-WebRequest "$base/ffmpeg-win-x64.exe"  -OutFile "ffmpeg-bin\ffmpeg.exe"
          Invoke-WebRequest "$base/ffprobe-win-x64.exe" -OutFile "ffmpeg-bin\ffprobe.exe"

      - name: Build with PyInstaller
        run: pyinstaller PostBridge.spec --noconfirm

      - name: Zip output folder
        shell: pwsh
        run: Compress-Archive -Path dist\PostBridge -DestinationPath PostBridge-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PostBridge-windows
          path: PostBridge-windows.zip
          retention-days: 5

  # ── Windows  (NVIDIA GPU build — bundles CUDA-enabled PyTorch) ──────────────
  # Drop-in replacement for build-windows for users with NVIDIA cards.
  # ~3 GB larger; gives 5-15x speedup on Whisper transcription.
  # PostBridge.spec auto-detects torch when it's installed and pulls in its
  # CUDA DLLs via collect_all().  Same source, two artifacts.
  build-windows-gpu:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt

      - name: Pre-download Whisper models (tiny / base / small)
        # Bundling these three keeps the install size manageable while
        # covering the practical choices for non-GPU users.  Medium and
        # large-v3 still download on first use.  Helper script handles
        # faster-whisper version differences.
        run: python _download_bundled_models.py

      - name: Install PyTorch with CUDA 12.8 (Blackwell / RTX 50-series)
        # cu128 wheels work on RTX 30, 40, and 50 series.  Pick a different
        # CUDA index (cu121, cu124) if you need to ship a build for an older
        # GPU family that doesn't support cu128.
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cu128

      - name: Download ffmpeg (Windows x64)
        shell: pwsh
        run: |
          $base = "https://github.com/shaka-project/static-ffmpeg-binaries/releases/download/n7.1-2"
          New-Item -ItemType Directory -Force ffmpeg-bin | Out-Null
          Invoke-WebRequest "$base/ffmpeg-win-x64.exe"  -OutFile "ffmpeg-bin\ffmpeg.exe"
          Invoke-WebRequest "$base/ffprobe-win-x64.exe" -OutFile "ffmpeg-bin\ffprobe.exe"

      - name: Build with PyInstaller
        run: pyinstaller PostBridge.spec --noconfirm

      - name: Zip output folder
        shell: pwsh
        run: Compress-Archive -Path dist\PostBridge -DestinationPath PostBridge-windows-gpu.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PostBridge-windows-gpu
          path: PostBridge-windows-gpu.zip
          retention-days: 5

  # ── macOS  Apple Silicon (M1 / M2 / M3) ─────────────────────────────────────
  build-macos-arm:
    runs-on: macos-14        # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt

      - name: Pre-download Whisper models (tiny / base / small)
        # Bundling these three keeps the install size manageable while
        # covering the practical choices for non-GPU users.  Medium and
        # large-v3 still download on first use.  Helper script handles
        # faster-whisper version differences.
        run: python _download_bundled_models.py

      - name: Download ffmpeg (macOS ARM64)
        run: |
          mkdir -p ffmpeg-bin
          base="https://github.com/shaka-project/static-ffmpeg-binaries/releases/download/n7.1-2"
          curl -fL -o ffmpeg-bin/ffmpeg-osx-arm64  "$base/ffmpeg-osx-arm64"
          curl -fL -o ffmpeg-bin/ffprobe-osx-arm64 "$base/ffprobe-osx-arm64"
          chmod +x ffmpeg-bin/ffmpeg-osx-arm64 ffmpeg-bin/ffprobe-osx-arm64

      - name: Build with PyInstaller
        run: pyinstaller PostBridge.spec --noconfirm

      - name: Zip .app (preserving macOS metadata)
        run: ditto -c -k --keepParent dist/PostBridge.app PostBridge-mac-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PostBridge-mac-arm64
          path: PostBridge-mac-arm64.zip
          retention-days: 5

  # Intel Macs (pre-2020) run the ARM build via Rosetta 2 — no separate job needed.
  # macos-13 Intel runners were deprecated by GitHub in early 2025.
