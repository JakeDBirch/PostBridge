name: Build PostBridge — Windows (GPU)

# Manual trigger only — Actions tab → "Build PostBridge — Windows (GPU)"
# → Run workflow.  Produces the PostBridge-windows-gpu artifact (~4 GB
# with bundled tiny/base/small Whisper models + CUDA-enabled PyTorch).
#
# For NVIDIA GPU users.  cu128 wheels work on RTX 30/40/50 series; for
# older GPU families, swap the index URL in the Install PyTorch step.
#
# Heavy artifact — only trigger when you actually need a fresh GPU
# build.  CPU-only users should run "Build PostBridge — Windows (CPU)"
# instead.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt

      - name: Pre-download Whisper models (tiny / base / small)
        # Bundling these three keeps the install size manageable while
        # covering the practical choices for non-GPU users.  Medium and
        # large-v3 still download on first use.
        run: python _download_bundled_models.py

      - name: Install PyTorch with CUDA 12.8 (Blackwell / RTX 50-series)
        # cu128 wheels work on RTX 30, 40, and 50 series.  Pick a
        # different CUDA index (cu121, cu124) if you need to ship a
        # build for an older GPU family that doesn't support cu128.
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cu128

      - name: Download ffmpeg (Windows x64)
        shell: pwsh
        run: |
          $base = "https://github.com/shaka-project/static-ffmpeg-binaries/releases/download/n7.1-2"
          New-Item -ItemType Directory -Force ffmpeg-bin | Out-Null
          Invoke-WebRequest "$base/ffmpeg-win-x64.exe"  -OutFile "ffmpeg-bin\ffmpeg.exe"
          Invoke-WebRequest "$base/ffprobe-win-x64.exe" -OutFile "ffmpeg-bin\ffprobe.exe"

      - name: Build with PyInstaller
        run: pyinstaller PostBridge.spec --noconfirm

      - name: Zip output folder
        shell: pwsh
        run: Compress-Archive -Path dist\PostBridge -DestinationPath PostBridge-windows-gpu.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PostBridge-windows-gpu
          path: PostBridge-windows-gpu.zip
          retention-days: 5
