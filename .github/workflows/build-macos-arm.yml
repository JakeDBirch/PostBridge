name: Build PostBridge — macOS (Apple Silicon)

# Manual trigger only — Actions tab → "Build PostBridge — macOS
# (Apple Silicon)" → Run workflow.  Produces the PostBridge-mac-arm64
# artifact (.app bundle with the bundled tiny Whisper model).
#
# Apple Silicon (M-series) Macs only.  Rosetta 2 runs Intel code on
# Apple Silicon, not the other way round, so this build will NOT launch
# on an Intel Mac; one would need an x64 build (build.sh on that Mac).
#
# ── Signing & notarization ───────────────────────────────────────────────
# With these repository secrets set (Settings → Secrets and variables →
# Actions), the app is signed with your Developer ID, notarized by Apple
# and stapled, so it opens on any Mac with no Gatekeeper warning:
#
#   MACOS_CERT_P12_BASE64        Developer ID Application cert + private
#                                key exported from Keychain as .p12,
#                                then  base64 -i cert.p12 | pbcopy
#   MACOS_CERT_PASSWORD          the password chosen for that .p12 export
#   APPLE_ID                     Apple ID email of the developer account
#   APPLE_APP_SPECIFIC_PASSWORD  from account.apple.com → Sign-In and
#                                Security → App-Specific Passwords
#   APPLE_TEAM_ID                10-character Team ID
#                                (developer.apple.com → Membership)
#
# Without them the build is ad-hoc signed — it runs, but a downloaded
# copy needs right-click → Open the first time.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14        # Apple Silicon runner
    env:
      HAVE_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
      HAVE_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build label
        # Short commit + run number, so a downloaded app can be matched to
        # the exact code it was built from (Finder → Get Info → Version).
        run: |
          echo "PB_BUILD_VERSION=${GITHUB_RUN_NUMBER}.$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "Building ${GITHUB_REF_NAME} @ $(git rev-parse --short HEAD)"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt

      - name: Pre-download Whisper models (tiny only)
        # Bundle just the tiny model so the installer stays small.
        # Every other size (base / small / medium / large-v3)
        # downloads on demand the first time the user picks it
        # in the model picker.
        run: python _download_bundled_models.py

      - name: Import Developer ID certificate
        if: env.HAVE_CERT == 'true'
        env:
          P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/build.keychain-db"
          kcpw="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          id="$(security find-identity -v -p codesigning "$kc" \
                | grep 'Developer ID Application' | head -1 \
                | sed -E 's/.*"(.*)"/\1/')"
          if [[ -z "$id" ]]; then
            echo "::error::No 'Developer ID Application' identity in MACOS_CERT_P12_BASE64."
            security find-identity -v -p codesigning "$kc"
            exit 1
          fi
          echo "Signing as: $id"
          echo "PB_CODESIGN_IDENTITY=$id" >> "$GITHUB_ENV"

      - name: Ad-hoc signing (no certificate configured)
        if: env.HAVE_CERT != 'true'
        run: |
          echo "::warning::MACOS_CERT_P12_BASE64 not set — ad-hoc signing. Downloaded copies will need right-click → Open."

      - name: Download ffmpeg (macOS ARM64)
        # Saved as plain ffmpeg / ffprobe — the names the app looks for
        # inside the bundle.  Checked to be arm64 and to run; PyInstaller
        # signs them along with the rest of the bundle.
        run: |
          mkdir -p ffmpeg-bin
          base="https://github.com/shaka-project/static-ffmpeg-binaries/releases/download/n7.1-2"
          curl -fL --retry 3 -o ffmpeg-bin/ffmpeg  "$base/ffmpeg-osx-arm64"
          curl -fL --retry 3 -o ffmpeg-bin/ffprobe "$base/ffprobe-osx-arm64"
          chmod +x ffmpeg-bin/ffmpeg ffmpeg-bin/ffprobe
          for b in ffmpeg-bin/ffmpeg ffmpeg-bin/ffprobe; do
            lipo -archs "$b" | grep -qw arm64 || { echo "::error::$b is not arm64"; exit 1; }
            "$b" -version | head -1
          done

      - name: Build and sign with PyInstaller
        # PyInstaller signs every binary and the bundle with
        # PB_CODESIGN_IDENTITY (hardened runtime + timestamp +
        # macos/entitlements.plist), or ad-hoc when it is unset.  Nothing
        # may re-sign the bundle after this: re-signing PyInstaller's main
        # executable is what made Apple reject it as "invalid".
        run: pyinstaller PostBridge.spec --noconfirm

      - name: Verify signatures
        # Check only.  With a Developer ID, every Mach-O must also carry
        # the Developer ID authority, a timestamp and the hardened runtime
        # — notarization's requirements — so a gap is named here.
        run: |
          if [[ -n "${PB_CODESIGN_IDENTITY:-}" ]]; then
            macos/verify_signing.sh dist/PostBridge.app --developer-id
          else
            macos/verify_signing.sh dist/PostBridge.app
          fi

      - name: Self-test a copy of the built app (bundled ffmpeg only)
        # Runs the real app binary in --self-test mode: finds ffmpeg and
        # ffprobe inside the bundle (PATH and Homebrew are ignored, so the
        # runner's own ffmpeg can't mask a broken bundle), probes a clip
        # with audio and one without, and extracts a waveform.  Runs after
        # signing, so a hardened-runtime problem fails here too.
        # On a COPY: the bundle that ships is never launched, so nothing
        # the app does at runtime can alter it after signing.  The copy's
        # seal is checked afterwards to show whether a launch modifies it.
        run: |
          rm -rf "$RUNNER_TEMP/selftest-copy"
          mkdir -p "$RUNNER_TEMP/selftest-copy"
          ditto dist/PostBridge.app "$RUNNER_TEMP/selftest-copy/PostBridge.app"
          set +e
          "$RUNNER_TEMP/selftest-copy/PostBridge.app/Contents/MacOS/PostBridge" --self-test "$RUNNER_TEMP/selftest.txt"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/selftest.txt" || true
          echo "--- seal of the copy after launching it ---"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/selftest-copy/PostBridge.app" \
            || echo "::warning::Launching the app modified its bundle (see above)."
          exit $rc

      - name: Re-verify the bundle that ships
        run: |
          codesign --verify --deep --strict --verbose=2 dist/PostBridge.app
          echo "--- entitlements embedded in the main executable ---"
          codesign -d --entitlements - --xml dist/PostBridge.app/Contents/MacOS/PostBridge 2>/dev/null \
            | plutil -p - || codesign -d --entitlements - dist/PostBridge.app/Contents/MacOS/PostBridge

      - name: Zip .app (preserving macOS metadata)
        run: ditto -c -k --keepParent dist/PostBridge.app PostBridge-mac-arm64.zip

      - name: Notarize and staple
        if: env.HAVE_CERT == 'true' && env.HAVE_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          auth=(--apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID")
          out="$(xcrun notarytool submit PostBridge-mac-arm64.zip "${auth[@]}" \
                 --wait --timeout 2h --output-format json)" || true
          echo "$out"
          status="$(echo "$out" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))' 2>/dev/null || true)"
          subid="$(echo "$out" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))' 2>/dev/null || true)"
          if [[ "$status" != "Accepted" ]]; then
            echo "::error::Notarization status: ${status:-unknown}"
            [[ -n "$subid" ]] && xcrun notarytool log "$subid" "${auth[@]}" || true
            exit 1
          fi
          xcrun stapler staple dist/PostBridge.app
          xcrun stapler validate dist/PostBridge.app
          # Re-zip so the download carries the stapled ticket (opens
          # without a warning even offline).
          rm PostBridge-mac-arm64.zip
          ditto -c -k --keepParent dist/PostBridge.app PostBridge-mac-arm64.zip

      - name: Notarization skipped
        if: env.HAVE_CERT == 'true' && env.HAVE_NOTARY != 'true'
        run: echo "::warning::Signed but NOT notarized — set APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID. Gatekeeper will still warn on downloaded copies."

      - name: Self-test the zipped app as a user would get it
        # Unzip into a fresh folder and test again — so anything the zip round-trip
        # loses (exec bits, symlinks, the signature) fails here instead of
        # on a user's Mac.  With notarization on, also require that
        # Gatekeeper accepts it.
        run: |
          rm -rf "$RUNNER_TEMP/unzipped"
          ditto -x -k PostBridge-mac-arm64.zip "$RUNNER_TEMP/unzipped"
          app="$RUNNER_TEMP/unzipped/PostBridge.app"
          codesign --verify --deep --strict "$app"
          if [[ "$HAVE_CERT" == "true" && "$HAVE_NOTARY" == "true" ]]; then
            # Quarantine it the way a browser download is, so the launch
            # below goes through the same Gatekeeper check a user's does.
            xattr -w -r com.apple.quarantine "0081;$(printf '%x' "$(date +%s)");Safari;" "$app"
            spctl --assess --type execute --verbose=4 "$app"
          else
            spctl --assess --type execute --verbose=4 "$app" \
              || echo "::notice::Gatekeeper rejects this build (expected without notarization)."
          fi
          set +e
          "$app/Contents/MacOS/PostBridge" --self-test "$RUNNER_TEMP/selftest-zip.txt"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/selftest-zip.txt" || true
          exit $rc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PostBridge-mac-arm64-${{ env.PB_BUILD_VERSION }}
          path: PostBridge-mac-arm64.zip
          retention-days: 5

      - name: Clean up keychain
        if: always() && env.HAVE_CERT == 'true'
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
