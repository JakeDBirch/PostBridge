[pytest]
# Capture output in Python, not at the file descriptors.  fd capture moves the
# process's standard handles around every test phase, and Tcl keeps the handle
# numbers it first saw for life.  When Windows later gives one of those numbers
# to a file Tcl opens, Tcl takes the file for that old channel and won't read it,
# so Tk fails to start in whichever test that lands on: "couldn't read file
# .../init.tcl: No error", or "no such file or directory", or "invalid command
# name tcl_findLibrary".  The app never moves these handles, so it can't hit this.
addopts = --capture=sys
