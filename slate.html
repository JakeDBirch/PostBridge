<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PostBridge Slate</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a1a;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
    }

    .title {
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 4px;
      color: #555;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    /* Clapperboard visual */
    .board {
      width: 260px;
      position: relative;
      margin-bottom: 36px;
    }

    .board-top {
      background: #111;
      border: 2px solid #333;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      height: 36px;
      display: flex;
      overflow: hidden;
      transform-origin: bottom center;
      transition: transform 0.08s ease-out;
    }

    .board-top.clap {
      animation: clap 0.12s ease-out;
    }

    @keyframes clap {
      0%   { transform: rotate(0deg); }
      30%  { transform: rotate(-22deg); }
      60%  { transform: rotate(3deg); }
      100% { transform: rotate(0deg); }
    }

    .stripe {
      flex: 1;
      border-right: 2px solid #1a1a1a;
    }
    .stripe:last-child { border-right: none; }
    .stripe.black { background: #111; }
    .stripe.white { background: #e8e8e8; }

    .board-body {
      background: #1e1e1e;
      border: 2px solid #333;
      border-top: none;
      border-radius: 0 0 4px 4px;
      padding: 10px 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 12px;
    }

    .field { font-size: 9px; letter-spacing: 1px; color: #444; }
    .value { font-size: 11px; font-weight: bold; color: #aaa; margin-top: 1px; }

    /* Flash overlay */
    .flash {
      position: fixed;
      inset: 0;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 100;
    }
    .flash.active {
      animation: flashAnim 0.15s ease-out forwards;
    }
    @keyframes flashAnim {
      0%   { opacity: 0.9; }
      100% { opacity: 0; }
    }

    /* Main slate button */
    .slate-btn {
      width: 260px;
      height: 80px;
      background: #2a2a2a;
      border: 2px solid #404040;
      border-radius: 6px;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 6px;
      cursor: pointer;
      transition: background 0.08s, border-color 0.08s, transform 0.05s;
      outline: none;
      position: relative;
      overflow: hidden;
    }

    .slate-btn:hover {
      background: #333;
      border-color: #666;
    }

    .slate-btn:active {
      transform: scale(0.97);
      background: #222;
    }

    .slate-btn.fired {
      border-color: #4caf50;
      color: #4caf50;
    }

    .slate-btn.fired::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(76,175,80,0.15) 0%, transparent 70%);
    }

    /* Counter */
    .counter {
      margin-top: 24px;
      font-size: 11px;
      letter-spacing: 2px;
      color: #444;
      height: 16px;
    }

    .counter span {
      color: #666;
    }

    /* Log */
    .log {
      margin-top: 16px;
      width: 260px;
      max-height: 100px;
      overflow-y: auto;
      font-size: 10px;
      color: #3a3a3a;
      letter-spacing: 0.5px;
    }

    .log-entry {
      padding: 2px 0;
      border-bottom: 1px solid #222;
      display: flex;
      justify-content: space-between;
      transition: color 0.3s;
    }

    .log-entry.recent { color: #4caf50; }

    .hint {
      position: fixed;
      bottom: 20px;
      font-size: 9px;
      letter-spacing: 2px;
      color: #2a2a2a;
    }
  </style>
</head>
<body>

<div class="flash" id="flash"></div>

<div class="title">PostBridge Slate</div>

<div class="board">
  <div class="board-top" id="boardTop">
    <div class="stripe black"></div>
    <div class="stripe white"></div>
    <div class="stripe black"></div>
    <div class="stripe white"></div>
    <div class="stripe black"></div>
    <div class="stripe white"></div>
    <div class="stripe black"></div>
    <div class="stripe white"></div>
  </div>
  <div class="board-body">
    <div>
      <div class="field">PRODUCTION</div>
      <div class="value" id="valProd">BLOOD TRAILS</div>
    </div>
    <div>
      <div class="field">TAKE</div>
      <div class="value" id="valTake">1</div>
    </div>
    <div>
      <div class="field">SESSION</div>
      <div class="value" id="valSession">VO</div>
    </div>
    <div>
      <div class="field">TIME</div>
      <div class="value" id="valTime">--:--:--</div>
    </div>
  </div>
</div>

<button class="slate-btn" id="slateBtn" onclick="fireSlate()">SLATE</button>

<div class="counter" id="counter">READY</div>

<div class="log" id="log"></div>

<div class="hint">SPACE OR CLICK TO SLATE</div>

<script>
  var takeCount = 1;
  var audioCtx = null;
  var lastFiredTime = null;

  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function playClap() {
    var ctx = getAudioCtx();
    var now = ctx.currentTime;

    // --- Sharp transient: filtered noise burst ---
    var slateDuration = 0.08; // 80ms
    var bufLen = Math.floor(ctx.sampleRate * slateDuration);
    var buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
    var data = buf.getChannelData(0);

    // Noise with very fast exponential decay — sharp attack, quick falloff
    var decay = ctx.sampleRate * 0.006; // ~6ms decay constant
    for (var i = 0; i < bufLen; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.exp(-i / decay);
    }

    var src = ctx.createBufferSource();
    src.buffer = buf;

    // High-pass at 1kHz to keep it crisp and distinct
    var hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 1000;
    hp.Q.value = 0.5;

    // Gain — loud so it stands out in both recordings
    var gain = ctx.createGain();
    gain.gain.setValueAtTime(4.0, now);

    src.connect(hp);
    hp.connect(gain);
    gain.connect(ctx.destination);
    src.start(now);
  }

  function fireSlate() {
    var btn = document.getElementById('slateBtn');
    var flash = document.getElementById('flash');
    var boardTop = document.getElementById('boardTop');
    var counter = document.getElementById('counter');

    playClap();

    // Visual feedback
    boardTop.classList.remove('clap');
    void boardTop.offsetWidth; // reflow to restart animation
    boardTop.classList.add('clap');

    flash.classList.remove('active');
    void flash.offsetWidth;
    flash.classList.add('active');

    btn.classList.add('fired');
    setTimeout(function() { btn.classList.remove('fired'); }, 600);

    // Update take counter
    document.getElementById('valTake').textContent = takeCount;
    document.getElementById('valTime').textContent = getTime();
    lastFiredTime = new Date();

    // Log entry
    addLog(takeCount, lastFiredTime);

    takeCount++;
    counter.innerHTML = 'TAKE <span>' + (takeCount - 1) + '</span> FIRED';
    setTimeout(function() {
      counter.innerHTML = 'READY &mdash; TAKE <span>' + takeCount + '</span>';
    }, 2000);
  }

  function addLog(take, time) {
    var log = document.getElementById('log');
    var entry = document.createElement('div');
    entry.className = 'log-entry recent';
    entry.innerHTML = '<span>TAKE ' + take + '</span><span>' + formatTime(time) + '</span>';
    log.insertBefore(entry, log.firstChild);
    setTimeout(function() { entry.classList.remove('recent'); }, 3000);
    // Keep last 10
    while (log.children.length > 10) log.removeChild(log.lastChild);
  }

  function getTime() {
    return formatTime(new Date());
  }

  function formatTime(d) {
    return d.toTimeString().slice(0,8);
  }

  // Keyboard: Space or Enter fires slate
  document.addEventListener('keydown', function(e) {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      fireSlate();
    }
  });

  // Clock
  setInterval(function() {
    document.getElementById('valTime').textContent = getTime();
  }, 1000);

  // Init counter
  document.getElementById('counter').innerHTML = 'READY &mdash; TAKE <span>1</span>';
</script>
</body>
</html>
